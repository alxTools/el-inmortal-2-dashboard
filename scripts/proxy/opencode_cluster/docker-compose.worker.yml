services:
  worker:
    image: ${OPENCODE_WORKER_IMAGE:-opencode-worker:latest}
    container_name: opencode-worker
    restart: unless-stopped
    ports:
      - "${OPENCODE_SERVER_PORT:-4096}:4096"
    environment:
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?set-in-env-file}
      OPENCODE_SERVER_HOSTNAME: 0.0.0.0
      OPENCODE_SERVER_PORT: 4096
      OPENCODE_MODEL: ${OPENCODE_MODEL:-openai/gpt-5}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    volumes:
      - ${OPENCODE_WORKER_STATE_DIR:-/opt/opencode-worker/state}:/home/opencode/.local/share/opencode
      - ${OPENCODE_WORKER_CONFIG_DIR:-/opt/opencode-worker/config}:/home/opencode/.config/opencode
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -u \"$${OPENCODE_SERVER_USERNAME}:$${OPENCODE_SERVER_PASSWORD}\" http://127.0.0.1:4096/global/health >/dev/null || exit 1"
        ]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
